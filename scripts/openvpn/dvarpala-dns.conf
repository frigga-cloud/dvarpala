# Dvarpala's resolver, for clients inside the walled garden.
#
# Installed as /etc/dnsmasq.d/dvarpala.conf.
#
# Why this exists at all
# ----------------------
# Two reasons, and the smaller one is the obvious one.
#
# The obvious one: a person who has just connected has no way of knowing where
# the sign-in page is. No operating system announces a captive portal when a
# VPN comes up - the check that produces that panel runs when a network is
# joined, not when a tunnel is established, so it never fires here. The address
# has to be communicated, and "open http://signin" is something a person can be
# told once and remember.
#
# The larger one: before this, the walled garden allowed port 53 to anywhere.
# DNS carries arbitrary data in both directions. Somebody unidentified could
# hold a conversation with any server on the internet through it - slowly, but
# reliably, and tunnelling over DNS is a well-worn technique. Everything else
# in the garden exists to prevent exactly that. Running the resolver here means
# port 53 can be closed to everywhere else.

# Answer only on the tunnel. Nothing outside should be able to use this as an
# open resolver - that is how a machine ends up amplifying somebody's attack.
interface=tun0
bind-interfaces
listen-address=172.30.100.1

# Do not read /etc/resolv.conf for upstreams; the ones below are deliberate.
no-resolv
no-poll

# Where real names are answered from. A client inside the garden cannot reach
# these itself, which is the point: this machine resolves on its behalf.
server=1.1.1.1
server=8.8.8.8

# The names that lead to the sign-in page.
#
# Both bare and dotted, because they fail in different places. A bare word is
# what somebody remembers, but a phone browser treats one as something to
# search for rather than a host to visit, and some resolvers will not look up
# a single label at all. A dotted name is unambiguously a hostname everywhere.
#
# .internal is set aside by ICANN for exactly this and will never be delegated,
# so nothing here can ever collide with a real name. Each entry also covers
# everything beneath it, so signin.vpn and anything.vpn both land here.
address=/signin/172.30.100.1
address=/portal/172.30.100.1
address=/dvarpala/172.30.100.1
address=/vpn/172.30.100.1
address=/internal/172.30.100.1

# Refuse to answer with a private address for a public name, except for the
# ones above. Without this exception dnsmasq would reject its own answers.
rebind-domain-ok=/signin/portal/dvarpala/vpn/internal/

# Modest cache. These clients are resolving a handful of names each.
cache-size=1000

# Do not forward names that cannot be public, or bare hostnames. They cannot
# be answered by an upstream and only leak what somebody is looking for.
domain-needed
bogus-priv
