server:
  port: 8080
  mode: debug
  read_timeout: 30s
  write_timeout: 30s

database:
  host: localhost
  port: 5432
  name: dvarpala
  user: dvarpala
  password: password
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 5

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 10

auth:
  session_duration: 28800 # 8 hours
  captive_portal_timeout: 300 # 5 minutes
  jwt_secret: your-jwt-secret-key
  allowed_domains:
    - yourcompany.com
    - subsidiary.com

oauth:
  google:
    client_id: ${GOOGLE_CLIENT_ID}
    client_secret: ${GOOGLE_CLIENT_SECRET}
    redirect_url: http://localhost:8080/auth/oauth/google/callback
  microsoft:
    client_id: ${MICROSOFT_CLIENT_ID}
    client_secret: ${MICROSOFT_CLIENT_SECRET}
    redirect_url: http://localhost:8080/auth/oauth/microsoft/callback
  github:
    client_id: ${GITHUB_CLIENT_ID}
    client_secret: ${GITHUB_CLIENT_SECRET}
    redirect_url: http://localhost:8080/auth/oauth/github/callback

openvpn:
  management:
    host: localhost
    port: 7505
  networks:
    captive_portal: 10.8.0.0/24
    full_access: 10.8.1.0/24

security:
  failed_login_threshold: 3
  ip_block_duration: 1200 # 20 minutes
  bcrypt_cost: 12

logging:
  level: debug
  format: json
  output: stdout
