# Dvarpala VPN Configuration
#
# These are DEFAULTS for local development.
#
# Every value below can be overridden by an environment variable - see
# loadEnvVars() in internal/config/config.go for the full mapping
# (e.g. server.port <- SERVER_PORT, database.host <- DB_HOST).
# Environment variables take priority over this file.
#
# NOTE: values must be literal. Viper does not expand ${VAR:default}
# syntax - it reads it as a plain string, which then fails to parse as
# a number or duration and prevents the server from starting.

server:
  port: 8080
  mode: debug
  read_timeout: 30s
  write_timeout: 30s

database:
  host: localhost
  port: 5432
  name: dvarpala_dev
  user: dvarpala
  password: dvarpala_password
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 5

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 10

auth:
  session_duration: 28800          # 8 hours, in seconds
  captive_portal_timeout: 1800     # 30 minutes, in seconds
  jwt_secret: dev-only-secret-change-me
  allowed_domains:
    - "acme.com"
    - "contractor.com"

oauth:
  google:
    client_id: ""
    client_secret: ""
    redirect_url: http://localhost:8080/auth/google/callback
  microsoft:
    client_id: ""
    client_secret: ""
    redirect_url: http://localhost:8080/auth/microsoft/callback
  github:
    client_id: ""
    client_secret: ""
    redirect_url: http://localhost:8080/auth/github/callback

openvpn:
  management:
    host: localhost
    port: 7505
  # NOTE: these are the ranges used by the older scripts/provisioning path.
  # The live cloud installer deploys 172.30.100.0/24 (captive) and
  # 172.30.8.0/21 (full access). Nothing in the Go code reads these values
  # yet; reconcile them when it does.
  networks:
    captive_portal: 192.168.100.0/24
    full_access: 10.0.0.0/8

security:
  failed_login_threshold: 5
  ip_block_duration: 1800          # 30 minutes, in seconds
  bcrypt_cost: 12

logging:
  level: debug
  format: json
  output: stdout
