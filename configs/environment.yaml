# Dvarpala VPN Configuration
# This configuration file uses environment variables for all values
# Set the corresponding environment variables in your .env file

server:
  port: ${SERVER_PORT:8080}
  mode: ${SERVER_MODE:debug}
  read_timeout: ${SERVER_READ_TIMEOUT:30s}
  write_timeout: ${SERVER_WRITE_TIMEOUT:30s}

database:
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:5432}
  name: ${DB_NAME:dvarpala_dev}
  user: ${DB_USER:dvarpala}
  password: ${DB_PASSWORD:dvarpala_password}
  ssl_mode: ${DB_SSL_MODE:disable}
  max_open_conns: ${DB_MAX_OPEN_CONNS:25}
  max_idle_conns: ${DB_MAX_IDLE_CONNS:5}

redis:
  addr: ${REDIS_ADDR:localhost:6379}
  password: ${REDIS_PASSWORD:}
  db: ${REDIS_DB:0}
  pool_size: ${REDIS_POOL_SIZE:10}

auth:
  session_duration: ${AUTH_SESSION_DURATION:28800}
  captive_portal_timeout: ${AUTH_CAPTIVE_PORTAL_TIMEOUT:1800}
  jwt_secret: ${AUTH_JWT_SECRET:your-super-secret-jwt-key-change-this-in-production}
  allowed_domains:
    - "yourcompany.com"
    - "contractor.com"

oauth:
  google:
    client_id: ${OAUTH_GOOGLE_CLIENT_ID:your-google-client-id}
    client_secret: ${OAUTH_GOOGLE_CLIENT_SECRET:your-google-client-secret}
    redirect_url: ${OAUTH_GOOGLE_REDIRECT_URL:http://localhost:8080/auth/google/callback}
  microsoft:
    client_id: ${OAUTH_MICROSOFT_CLIENT_ID:your-microsoft-client-id}
    client_secret: ${OAUTH_MICROSOFT_CLIENT_SECRET:your-microsoft-client-secret}
    redirect_url: ${OAUTH_MICROSOFT_REDIRECT_URL:http://localhost:8080/auth/microsoft/callback}
  github:
    client_id: ${OAUTH_GITHUB_CLIENT_ID:your-github-client-id}
    client_secret: ${OAUTH_GITHUB_CLIENT_SECRET:your-github-client-secret}
    redirect_url: ${OAUTH_GITHUB_REDIRECT_URL:http://localhost:8080/auth/github/callback}

openvpn:
  management:
    host: ${OPENVPN_MANAGEMENT_HOST:localhost}
    port: ${OPENVPN_MANAGEMENT_PORT:7505}
  networks:
    captive_portal: ${OPENVPN_CAPTIVE_PORTAL_NETWORK:192.168.100.0/24}
    full_access: ${OPENVPN_FULL_ACCESS_NETWORK:10.0.0.0/8}

security:
  failed_login_threshold: ${SECURITY_FAILED_LOGIN_THRESHOLD:5}
  ip_block_duration: ${SECURITY_IP_BLOCK_DURATION:1800}
  bcrypt_cost: ${SECURITY_BCRYPT_COST:12}

logging:
  level: ${LOG_LEVEL:debug}
  format: ${LOG_FORMAT:json}
  output: ${LOG_OUTPUT:stdout}